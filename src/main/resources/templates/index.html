<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nevis Search</title>
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <style>
        :root {
            --fg: #1f2328;
            --muted: #59636e;
            --line: #d1d9e0;
            --accent: #0969da;
            --bg: #ffffff;
            --panel: #f6f8fa;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e6edf3;
                --muted: #9198a1;
                --line: #3d444d;
                --accent: #4493f8;
                --bg: #0d1117;
                --panel: #151b23;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            /* Centre the box like a search engine landing page: centred horizontally,
               and vertically until results push the page down. */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 64px;
        }

        .hero {
            width: 100%;
            max-width: 620px;
            /* min-height + centring keeps the box mid-screen when empty, but lets the page
               grow naturally once results arrive rather than trapping them below the fold. */
            min-height: 48vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        h1 span { color: var(--muted); font-weight: 400; }

        input[type="search"] {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.0625rem;
            color: var(--fg);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 999px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        input[type="search"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
        }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

        button {
            padding: 10px 20px;
            font-size: .9375rem;
            font-family: inherit;
            color: var(--fg);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover { border-color: var(--accent); color: var(--accent); }
        button:active { transform: translateY(1px); }

        .hint { color: var(--muted); font-size: .8125rem; text-align: center; }

        #results { width: 100%; max-width: 620px; }

        /* htmx toggles this class on the element named by hx-indicator while a request
           is in flight. */
        .spinner { display: none; color: var(--muted); font-size: .875rem; text-align: center; }
        .htmx-request .spinner, .htmx-request.spinner { display: block; }
    </style>
</head>
<body>
<div class="hero">
    <h1>Nevis <span>Search</span></h1>

    <!-- name="q" matters: hx-include pulls this field into the query string as ?q=... -->
    <input type="search" id="q" name="q" autofocus autocomplete="off"
           placeholder="Search clients and documents"
           aria-label="Search query">

    <div class="actions">
        <!-- Two buttons, two endpoints. The button chosen decides which search runs. -->
        <button type="button"
                hx-get="/ui/search/documents"
                hx-include="#q"
                hx-target="#results"
                hx-indicator="#spinner">
            Find Documents
        </button>
        <button type="button"
                hx-get="/ui/search/clients"
                hx-include="#q"
                hx-target="#results"
                hx-indicator="#spinner">
            Find Clients
        </button>
    </div>

    <p class="hint">
        Try <code>NevisWealth</code> for clients, or <code>address proof</code> for documents.
    </p>
</div>

<div id="spinner" class="spinner">Searching&hellip;</div>
<div id="results" aria-live="polite"></div>
</body>
</html>
