<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Swapped into #results by htmx. Rendered for both buttons; `kind` says which ran. -->
<div th:fragment="results">
    <style>
        .summary { color: var(--muted); font-size: .875rem; margin: 8px 0 12px; }
        .card {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: var(--panel);
        }
        .card h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 600; }
        .card .meta { color: var(--muted); font-size: .8125rem; }
        .card .body { margin-top: 10px; font-size: .9375rem; white-space: pre-line; }
        .badge {
            display: inline-block; padding: 1px 8px; border-radius: 999px;
            border: 1px solid var(--line); font-size: .75rem; color: var(--muted);
        }
        .empty { color: var(--muted); text-align: center; padding: 20px 0; }
        .overview {
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 14px;
            background: var(--panel);
            font-size: .9375rem;
        }
        .overview .label {
            display: block;
            font-size: .6875rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .card .summary {
            margin-top: 10px;
            padding: 8px 10px;
            border-left: 3px solid var(--accent);
            border-radius: 0 6px 6px 0;
            background: color-mix(in srgb, var(--accent) 7%, transparent);
            font-size: .875rem;
        }
        .card .summary .label {
            display: block;
            font-weight: 600;
            font-size: .6875rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 3px;
        }
        .card .body .label {
            display: block;
            font-weight: 600;
            font-size: .6875rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }
        .empty code { font-size: .875rem; }
    </style>

    <p class="empty" th:if="${blank}">
        Type something to search.
    </p>

    <div th:unless="${blank}">
        <!-- One line describing the whole result set, from the centroid of the top hits. -->
        <div class="overview" th:if="${overview != null}">
            <span class="label">About these results</span>
            <span th:text="${overview}">overview</span>
        </div>

        <p class="summary">
            <span th:text="${#lists.size(results)}">0</span>
            <span th:text="${kind == 'clients'} ? 'client match(es)' : 'document match(es)'">matches</span>
            for <strong th:text="${query}">query</strong>
        </p>

        <p class="empty" th:if="${#lists.isEmpty(results)}">
            No matches.
            <br>
            <!-- Honest about the current state: search is not implemented yet, so this is
                 always the outcome. Better to say so than to look broken. -->
            <small>Search is not implemented yet &mdash; the API returns an empty list for
                every query, so this is expected.</small>
        </p>

        <div th:each="r : ${results}" class="card">
            <span class="badge" th:text="${r.type}">type</span>

            <div th:if="${r.client != null}">
                <h3 th:text="${r.client.firstName} + ' ' + ${r.client.lastName}">Name</h3>
                <div class="meta" th:text="${r.client.email}">email</div>
                <div class="body" th:if="${r.client.description != null}"
                     th:text="${r.client.description}">description</div>
            </div>

            <div th:if="${r.document != null}">
                <h3 th:text="${r.document.title}">Title</h3>
                <div class="meta">
                    client <span th:text="${r.document.clientId}">id</span>
                </div>
                <!-- The document's own summary, generated on write. Falls back to the opening
                     of the content if a document has not been summarised yet. -->
                <div class="summary" th:if="${r.document.summary != null}">
                    <span class="label">Document summary</span>
                    <span th:text="${r.document.summary}">summary</span>
                </div>
                <div class="body">
                    <span class="label">Document text</span>
                    <span th:text="${r.document.content}">content</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
