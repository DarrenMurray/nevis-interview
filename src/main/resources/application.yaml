spring:
  application:
    name: search-api

  datasource:
    # Defaults match docker-compose so `docker compose up` needs no env vars. Cloud Run
    # overrides all three; the password there comes from Secret Manager.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search}
    username: ${DB_USER:search_api}
    password: ${DB_PASSWORD:search_api}

  flyway:
    # Migrations run at startup, so a fresh database self-provisions. The first migration
    # creates the vector/pg_trgm/citext extensions as well as the tables.
    enabled: true
    locations: classpath:db/migration
  jackson:
    # The API spec uses snake_case (first_name, client_id, social_links); Java fields stay camelCase.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

springdoc:
  api-docs:
    # OpenAPI 3.1 to match the version the assignment's spec was written against.
    version: openapi_3_1
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Show endpoints grouped by tag, in the order declared rather than alphabetically.
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

logging:
  structured:
    format:
      # One JSON object per line, in Cloud Logging's shape. Overridden to empty locally by the
      # `local` profile so the console stays readable.
      console: com.nevis.search.observability.CloudLoggingFormatter

search:
  rate-limit:
    # Global across the service, not per caller: the API is unauthenticated, so there is no
    # identity to meter against, and the point is to bound spend on a personal account.
    requests-per-minute: 60
