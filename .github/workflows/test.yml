name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # JDK, not JAVA_HOME: the Makefile uses its own variable so an inherited JAVA_HOME
      # cannot override the required Java version.
      - name: Run tests
        run: make JDK="$JAVA_HOME" test

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        run: make docker-build

      # End-to-end check of the compose stack against the three core use cases. The only
      # job that exercises the Dockerfile, the migrations and the embedding backfill.
      - name: End-to-end tests
        run: |
          set -o pipefail
          make docker-smoke 2>&1 | tee smoke.log

      - name: Publish end-to-end results
        if: always()
        run: |
          {
            echo "### End-to-end (docker compose)"
            echo '```'
            # From the first check group onwards; the build output above is noise here.
            sed -n '/^Schema$/,$p' smoke.log || echo "stack did not start"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
