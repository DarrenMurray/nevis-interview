name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # JDK, not JAVA_HOME: the Makefile deliberately uses its own variable so an
      # inherited JAVA_HOME cannot silently override the required Java version.
      - name: Run tests
        run: make JDK="$JAVA_HOME" test

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        run: make docker-build

      # Boots the image and asserts it serves traffic. This is the only check that
      # exercises the Dockerfile's assembly - the Maven suite never touches it.
      - name: Smoke test image
        run: make docker-smoke
